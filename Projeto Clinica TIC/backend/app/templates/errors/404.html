{% extends "base.html" %}
{% block title %}Página Não Encontrada — {{ app_name }}{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="empty-state-icon mb-3 text-warning"><i class="bi bi-question-circle"></i></div>
    <h2 class="fw-bold mb-2">404 — Página Não Encontrada</h2>
    <p class="text-muted mb-4">A página que você procura não existe ou foi movida.</p>
    <a href="{{ url_for('web.dashboard') }}" class="btn btn-accent">
        <i class="bi bi-arrow-left me-1"></i> Voltar ao Dashboard
    </a>
</div>
{% endblock %}
