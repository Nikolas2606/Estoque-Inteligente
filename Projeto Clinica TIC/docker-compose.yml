# ============================================
# Sistema de Estoque Inteligente
# Docker Compose - Orquestração de Serviços
# ============================================

services:
  # ---- Banco de Dados (MariaDB) ----
  db:
    image: mariadb:11
    container_name: estoque_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - ${PATH_DATABASE}:/var/lib/mysql
    networks:
      - estoque_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- Broker MQTT (Eclipse Mosquitto) ----
  broker:
    image: eclipse-mosquitto:2
    container_name: estoque_broker
    restart: unless-stopped
    ports:
      - "1883:1883"       # Exposto para ESP32 na rede local
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - estoque_net

  # ---- Aplicação Flask ----
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estoque_app
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MQTT_BROKER_HOST: broker
      MQTT_BROKER_PORT: 1883
      MQTT_ENABLED: "true"
      ALEXA_API_KEY: ${ALEXA_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started
    volumes:
      - ${PATH_FOTOS}:/app/fotos
    networks:
      - estoque_net
    command: >
      sh -c "
      python -c 'from app import create_app; create_app(\"development\").app_context().push(); from app.extensions import db; db.create_all()' &&
      python seed.py &&
      flask run --host=0.0.0.0
      "
      

  # ---- Proxy Reverso (Nginx) ----
  web:
    image: nginx:alpine
    container_name: estoque_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PATH_FOTOS}:/usr/share/nginx/fotos:ro
    depends_on:
      - app
    networks:
      - estoque_net


  # ---- Cloudflare Tunnel ----
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: estoque_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:5000
    depends_on:
      - app
    networks:
      - estoque_net


# ---- Rede Interna ----
networks:
  estoque_net:
    driver: bridge

# ---- Volumes Nomeados ----
volumes:
  mosquitto_data:
  mosquitto_log:
