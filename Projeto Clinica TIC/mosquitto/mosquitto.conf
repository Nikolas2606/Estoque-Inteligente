# ============================================
# Eclipse Mosquitto - Configuração Minimalista
# Sistema de Estoque Inteligente
# ============================================

# Listener na porta padrão MQTT
listener 1883

# Permitir conexões anônimas (contexto colegial)
allow_anonymous true

# Persistência de mensagens
persistence true
persistence_location /mosquitto/data/

# Logs
log_dest file /mosquitto/log/mosquitto.log
log_type warning
log_type error
log_type information
